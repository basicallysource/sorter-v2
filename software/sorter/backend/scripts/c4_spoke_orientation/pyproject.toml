[project]
name = "c4-spoke-orientation"
version = "0.0.0"
description = "One-shot CV detector for C4 platter spoke orientation. Local dev / scratch tool."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "boto3>=1.40",
    "jinja2>=3.1",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
