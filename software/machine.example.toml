# Machine-specific parameters
# The Sorter reads software/machine.toml: copy this file there and edit the copy.
# MACHINE_SPECIFIC_PARAMS_PATH, if set, points it at a different file instead.
# This file is for parameters that vary between machines and local setups.

[servo]
# For PCA9685 (default):
# backend = "pca9685"
# PCA9685 open/closed angles are calibrated per-layer (see [layers] below), not
# globally — there is no machine-wide default open/closed angle.

# For Waveshare SC bus servos, uncomment below:
# backend = "waveshare"
# port = "/dev/cu.usbmodem5A7C1215731"  # optional, auto-detected if omitted
#
# [[servo.channels]]
# id = 1
# invert = false
#
# [[servo.channels]]
# id = 2
# invert = false

# Each entry in sections is one layer's bin layout (bottom to top).
# servo_open_angles / servo_closed_angles set the PCA9685 servo open/closed
# angles per layer index. A layer is only "calibrated" (and driven on home)
# when both its open and closed angle are set.
[layers]
sections = [
    [["medium", "medium"], ["medium", "medium"], ["medium", "medium"], ["medium", "medium"], ["medium", "medium"], ["medium", "medium"]],
    [["medium", "medium"], ["medium", "medium"], ["medium", "medium"], ["medium", "medium"], ["medium", "medium"], ["medium", "medium"]],
]
# servo_open_angles = {1 = 25}
# servo_closed_angles = {1 = 110}

# [layers.servo_open_angles]
# 0 = 25
# 3 = 0
# 4 = 28

# [layers.servo_closed_angles]
# 0 = 105
# 3 = 65
# 4 = 78

# --- Chute positioning calibration ---
# These values define where the first bin center sits after homing and how much
# angular width each divider pillar consumes. They directly affect how the chute
# computes bin center positions around the ring.

# [chute]
# home_pin_channel = 3
# first_bin_center = 8.4
# pillar_width_deg = 1.9
# endstop_active_high = true

# --- Stepper binding and direction overrides ---
# Use stepper_bindings when the physical wiring does not match the firmware's
# default logical names. Example: carousel motor physically wired to feeder E0,
# while the firmware reports that channel as c_channel_1_rotor.
#
# [stepper_bindings]
# carousel = "c_channel_1_rotor"
# c_channel_1 = "carousel"
#
# Use stepper_direction_inverts to flip logical CW / CCW without reflashing.
#
# [stepper_direction_inverts]
# carousel = false

# --- Camera configuration ---
# One camera for each of C2, C3 and the classification channel (C4).
# Sources are OpenCV device indices or network stream URLs (scripts/cam-sim
# serves simulated streams).
[cameras]
c_channel_2 = 0
c_channel_3 = 1
classification_channel = 2
# classification_channel = "http://localhost:9005/"

# Per-role capture mode. STRONGLY RECOMMENDED on Linux. If omitted, OpenCV's V4L2
# backend negotiates YUYV by default, which on USB 2.0 webcams either falls back
# to a tiny resolution / single-digit fps OR exhausts the bus's iso bandwidth
# (~480 Mbps shared) and STREAMON returns "No space left on device". MJPG is
# compressed by the camera and uses ~10x less bandwidth, so multi-cam setups on
# a single USB 2.0 bus only fit if you force MJPG here. macOS / AVFoundation
# usually picks MJPG on its own; Linux does not.
# [camera_capture_modes.c_channel_2]
# fourcc = "MJPG"
# width = 1280
# height = 720
# fps = 30

# [camera_picture_settings.c_channel_2]
# rotation = 0
# flip_horizontal = false
# flip_vertical = false

# [camera_picture_settings.classification_channel]
# rotation = 0
# flip_horizontal = false
# flip_vertical = false

[stepper_current_overrides]
# default = 16, max = 31

# [stepper_current_overrides.chute_stepper]
# irun = 16

[stepper_direction_inverts]
carousel = true
