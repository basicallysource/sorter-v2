metadata:
  title: Chute limit switch lead
  description: "The chute limit switch lead, x1 per machine. The buildable\nsub-harness for LIM1 on the LED drops and limit switch\ndrawing. Nothing on it is soldered: two crimps at the\nboard, two push-on tabs at the switch."

connectors:
  BOARD:
    type: Dupont 1x3 female, 2.54 mm
    pincount: 3
    pinlabels: [GND, SIG, "+3V3"]
    notes: "basically board v1.3 J5, the header printed\nHALL_SW_0. Position 1 is the cavity at the\nmoulded arrow. Position 3 carries no contact:\nit lines up with the 3.3 V pin, which is what\nstops the housing going on backwards.\nJ6 beside it is a spare input, not this one."
    additional_components:
      - type: "Terminal - Dupont crimp, 2.54 mm"
        qty: 1
        qty_multiplier: populated
  SW:
    type: "Quick-connect receptacle, #187"
    subtype: "4.75 x 0.5 mm tab, insulated"
    pinlabels: [GND, SIG]
    notes: "Omron V-155-1C25. The switch is SPDT and its\nthird tab stays bare."

cables:
  LIM1:
    gauge: 22 AWG
    length: 24 in
    colors: [BK, WH]
    notes: "qty 1. Two conductors, black ground and\nwhite signal."

connections:
  -
    - BOARD: [1-2]
    - LIM1: [1-2]
    - SW: [1-2]
