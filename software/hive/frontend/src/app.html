<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Hive's site color is red: software/sorter-design-system/docs/apps.md, Favicons. -->
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
		<link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script>
			// Before first paint, so a dark page never flashes light
			// (src/lib/stores/theme.ts owns this key after this).
			try {
				const stored = localStorage.getItem('hive.theme');
				const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
			} catch {}
		</script>
		<title>Hive</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- Cloudflare Web Analytics -->
		<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"136554ad5e4a46f49c232d6ea955650b"}'></script>
		<!-- End Cloudflare Web Analytics -->
	</body>
</html>
