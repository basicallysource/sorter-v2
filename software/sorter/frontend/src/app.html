<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- A machine's site color is blue: software/sorter-design-system/docs/apps.md, Favicons. -->
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
		<link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<title>Sorter</title>
		<script>
			// Before first paint, so a dark page never flashes light ($lib/theme
			// applies the saved mode from the same key after this).
			try {
				const saved = JSON.parse(localStorage.getItem('settings') || '{}');
				document.documentElement.classList.toggle('dark', saved.theme === 'dark');
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
