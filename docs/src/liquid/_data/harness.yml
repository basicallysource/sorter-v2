  - name: leds
    title: LED drops and limit switch (LED1 to LED3, LED1p to LED3p, LIM1)
    caption: >-
      LED feeds LED1 to LED3 to their unplug-point jacks, pigtails LED1p to LED3p to the LED
      strips, and the limit switch cable (LIM1, 1x3 dupont at the
      board, push-on blade terminals at the switch).
    png: https://assets.basically.website/sorter-harness/leds-full-be9ce67bd91a.png
