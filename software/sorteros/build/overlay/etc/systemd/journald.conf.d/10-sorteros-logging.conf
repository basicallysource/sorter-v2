# journald is the only log store on a sorter — nothing gets duplicated into
# /var/log/syslog.
#
# The backend logs several lines per frame (perception summaries, every stepper
# move), which is ~50 KB/s. With the default forwarding, rsyslog wrote a second
# copy of all of it to /var/log/syslog, and that file is only bounded by
# logrotate. On gbl-01, logrotate.conf was zeroed out by an unclean shutdown, so
# nothing rotated for months: syslog reached 7.2 GB, filled the 30 GB card, and
# the machine sorted for ~10 days with no run history, no piece images and no
# Hive sync (SQLite writes to local_state.sqlite failed on a full disk).
#
# journald's own store is capped by SystemMaxUse, so keeping logs only here
# bounds them no matter how chatty the backend gets or whether logrotate works.
# Read them with journalctl (e.g. `journalctl -u sorter-backend-dev -f`).
#
# Storage=persistent because the vendor image ships Storage=volatile with
# /var/log on zram: the journal lived in RAM and every reboot destroyed it, so
# any fault that survived a restart had no history to correlate against. This
# needs the vendor ramlog service off, or the journal just fills a 200 MB zram
# instead of the disk.
[Journal]
Storage=persistent
ForwardToSyslog=no
SystemMaxUse=500M
