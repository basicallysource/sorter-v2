# SorterOS build config

[base]
# Orange Pi 5 Ubuntu Jammy server image — kernel 6.1.99
# Orange Pi's official download (Google Drive). Put the .img in cache/ or
# point SORTEROS_BASE_IMG at it; the build checks this sha256.
url = "https://drive.google.com/file/d/1A-XwhSnRb_TaDfDxF6tNzfNyvHy8tn7w/view"
filename = "Orangepi5_1.2.2_ubuntu_jammy_server_linux6.1.99.img"
sha256 = "ae53507811323a4c6ac4db71df98e043fc64de07657440f14b079a0994e8810a"

[output]
dir = "out"
version = "4.1.1"
name = "sorteros-v{version}-{date}.img"

[chroot]
# Documentation only — the actual apt invocation lives in chroot_apt.sh.
# Keep this list in sync so config-readers see the real package set.
# Every entry is build time and image bytes; keep it short.
packages = [
    "network-manager",    # Wi-Fi client + AP-mode
    "dnsmasq-base",       # DHCP/DNS binary NM spawns for the AP captive portal
    "python3-pip",
    "python3-tomli",      # tomllib backport for Python 3.10 (Ubuntu Jammy)
    "libgl1",             # OpenCV runtime dep
    "libglib2.0-0",       # OpenCV runtime dep
    "v4l-utils",          # camera inspection / V4L2 tools
    "avahi-daemon",       # answers as sorter.local on the LAN
    "libnss-mdns",        # resolves other .local names from the machine
    "cloud-guest-utils",  # provides growpart for stage_grow_rootfs
    "figlet",             # MOTD ASCII art for SorterOS login screen
    "systemd-timesyncd",  # NTP sync — required so first-boot TLS certs validate
    "qrencode",           # captive-portal handoff QR codes (not the JS one)
]

# Installed via curl scripts / pip in chroot_apt.sh (NOT apt):
#   - Node 22 via deb.nodesource.com (pnpm@latest requires >=22.13)
#   - Tailscale via tailscale.com/install.sh
#   - fastapi + uvicorn + pydantic via pip for sorteros-portal
extra_curl_installs = ["node22", "tailscale", "portal-py-deps"]

[source]
# What firstboot checks out, baked into /etc/sorteros/ref. "stable" = the
# newest sorter/stable/v* tag at first boot, the same channel the Sorter UI's
# Versions page updates within. A test image can bake a branch, tag or commit
# instead: build.py --ref <ref>.
ref = "stable"
