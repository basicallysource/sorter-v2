  - name: steppers
    title: Stepper cables (STP1 to STP4, CHU1)
    caption: >-
      The channel stepper cable (STP1 to STP4), board PHR-4 to the motor's own PHR-6 with positions 2
      and 5 empty, and the straight-through chute cable (CHU1) to bare labeled leads.
    png: https://assets.basically.website/sorter-harness/steppers-full-a89181262091.png
    svg: https://assets.basically.website/sorter-harness/steppers-6b18a7de6a00.svg
