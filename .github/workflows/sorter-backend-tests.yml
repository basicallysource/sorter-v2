name: Sorter backend tests

# The sorter backend's suite on every PR that touches the backend, or the Hive
# client it imports from software/hive/sorter-client.

on:
  pull_request:
    paths:
      - 'software/sorter/backend/**'
      - 'software/hive/sorter-client/**'
      - '.github/workflows/sorter-backend-tests.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/sorter/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: software/sorter/backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q
