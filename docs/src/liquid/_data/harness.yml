  - name: limit-switch
    title: Chute limit switch lead (LIM1)
    of: leds
    guide: /hardware/helpers/limit-switch-lead/
    caption: >-
      The switch that tells the machine where the chute is. Nothing on it is
      soldered: two crimps into a 1x3 Dupont at the board, two push-on
      #187 receptacles at the switch.
    png: https://assets.basically.website/sorter-harness/limit-switch-full-c9083f87d068.png
