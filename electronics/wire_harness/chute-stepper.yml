metadata:
  title: Chute stepper lead
  description: "The chute stepper lead, x1 per machine. The buildable\nsub-harness for CHU1 on the stepper cables drawing. The\nNEMA 23 has bare flying leads, so this one is spliced\nrather than plugged."

connectors:
  BOARD:
    type: JST PH 4-pin (PHR-4)
    subtype: 2.0mm pitch, female
    pinlabels: [A2, A1, B1, B2]
    notes: "basically board v1.3 J23. J24 beside it is\nthe same four nets on 2.54 mm pins, so a\n4-way Dupont there is equally correct.\nPositions 1-2 are one coil, 3-4 the other."
    additional_components:
      - type: Terminal - SPH-002T-P0.5S
        qty: 1
        qty_multiplier: populated
        manufacturer: JST
        mpn: SPH-002T-P0.5S
  MOTOR:
    type: Bare tinned leads, spliced
    pinlabels: [coil A, coil A, coil B, coil B]
    notes: "Ordered with this end bare: stripped 5 mm\nand tinned. Splice it to the NEMA 23's own\nfour leads, 20 AWG, too thick for a PH\ncontact. Find the coil pairs with a meter\nfirst: a pair reads well under an ohm."

cables:
  CHU1:
    category: bundle
    type: 4 wire bundle
    gauge: 24 AWG
    wirecount: 4
    length: 300 mm
    colors: [BK, GN, RD, BU]
    notes: "qty 1. Straight through. Gauge is set by the\nPH contact, which takes 24 to 28 AWG.\nLength is the tail only, without the motor's\nown 300 to 500 mm leads: about 600 mm\noverall with 300 mm leads."

connections:
  -
    - BOARD: [1-4]
    - CHU1: [1-4]
    - MOTOR: [1-4]
