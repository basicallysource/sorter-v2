name: Check part data

# The generated part data is written by whoever edits the slicer inputs --
# running catalog/generate.py against a local OrcaSlicer or, with
# ASSET_SERVICE_TOKEN set, against the asset service's slicer worker -- and
# committed in the same change. Nothing regenerates anything in CI, so a PR's
# preview always shows the branch's own data, and the checks here are the
# whole gate:
#
#  - check_generated_pins.py  : the generated data agrees with the source pins
#                               ("edited parts.json, forgot to regenerate")
#  - check_bucket_urls.py     : every URL the site ships serves real bytes
#                               (the bucket is content-addressed, so a wrong
#                               URL is a 200 with the wrong bytes, not a 404)
#
# Both are pure checks, a minute end to end. regen-parts.yml -- the old
# CI-canonical slicer that committed back onto PR branches -- is deleted; its
# job moved into the asset service (an STL upload gets slice reports and a
# render as derived forms) and slicing follows the editor instead of the
# merge.

on:
  pull_request:
    paths:
      - 'parts-calculator/**'
  push:
    branches: [main]
    paths:
      - 'parts-calculator/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 2, not 1: check_generated_pins.py reads HEAD~1's parts.json to
          # prove no uid was removed (on a PR's merge ref HEAD~1 is main).
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python parts-calculator/scripts/check_generated_pins.py
      - run: python parts-calculator/scripts/check_bucket_urls.py
