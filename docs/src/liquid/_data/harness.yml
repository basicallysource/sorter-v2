  - name: chute-stepper
    title: Chute stepper lead (CHU1)
    of: steppers
    guide: /hardware/helpers/chute-stepper-lead/
    caption: >-
      The one stepper lead (CHU1) that is spliced rather than plugged. The NEMA 23's
      own leads are 20 AWG (0.52 mm²), too thick for a PH contact, so a 24 AWG (0.20 mm²) tail
      carries the last stretch to the board.
    png: https://assets.basically.website/sorter-harness/chute-stepper-full-b3d1f8d6f543.png
