metadata:
  title: Stepper cables
  description: "Channel stepper cable S (x4) and chute stepper cable CH. S\nfollows the stepper reference drawing (2026-08-08),\nwhich is the source of truth for the channel cable. Values\nmarked GUESS are guesses, not measurements."

connectors:
  BOARD_S:
    type: JST PH 4-pin (PHR-4)
    subtype: 2.0mm pitch, female
    pinlabels: [A2, A1, B1, B2]
    notes: "controller board v1.3 J23/J27/J31/J35. One\ncable per jack, x4 identical."
    additional_components:
      - type: Terminal - SPH-002T-P0.5S
        qty: 1
        qty_multiplier: populated
        manufacturer: JST
        mpn: SPH-002T-P0.5S
  MOTOR_S:
    type: JST PH 6-pin (PHR-6)
    subtype: 2.0mm pitch, female
    pinlabels: [A2, C1, B1, A1, C2, B2]
    notes: "The NEMA 17's own 6-pin PH socket. Pins 2 and\n5 (C1, C2) are unpopulated. Check coils with a\nmultimeter before connecting."
    additional_components:
      - type: Terminal - SPH-002T-P0.5S
        qty: 1
        qty_multiplier: populated
        manufacturer: JST
        mpn: SPH-002T-P0.5S
  BOARD_CH:
    type: JST PH 4-pin (PHR-4)
    subtype: female
    pinlabels: [A2, A1, B1, B2]
    notes: controller board v1.3 J39
  CH_LEADS:
    type: Bare tinned leads, labeled 1-4
    pinlabels: [A2, A1, B1, B2]
    notes: "Splice to the chute stepper flying leads. Find\nthe coil pairs with a multimeter first."

cables:
  S:
    category: bundle
    type: 4 wire bundle
    gauge: 24 AWG
    length: 1 m
    wirecount: 4
    colors: [BU, GN, RD, BK]
    notes: "S1-S4, qty 4. NOT straight-through, see\ncrossover."
    additional_components:
      - type: PVC Sleeving
        qty: 1
  CH:
    category: cable
    gauge: 24 AWG
    length: 40 in
    colors: [BK, GN, RD, BU]
    notes: "qty 1. Straight-through. Not covered by the\nreference drawing, so unlike S both Gauge and\nLength here are still GUESS."

connections:
  -
    - BOARD_S: [1-4]
    - S: [1-4]
    - MOTOR_S: [1, 4, 3, 6]
  -
    - BOARD_CH: [1-4]
    - CH: [1-4]
    - CH_LEADS: [1-4]
