    bom_tsv: https://assets.basically.website/sorter-harness/power-bom-e638a27f8b11.tsv
    yml: https://assets.basically.website/sorter-harness/power-9841334e7c08.yml
  - name: psu-pigtail
    title: PSU output pigtail (PSU1 to PSU3)
    of: power
    caption: >-
      One output pigtail, x3 per PSU build. Spade terminals onto a +V/-V screw
      pair on the PSU terminal block (7 with 4, 8 with 5, 9 with 6),
      panel-mount jack on the other end.
    photo: https://assets.basically.website/sorter-docs/harness-psu-pigtail-built-w1600-59554dc6b189.jpg
    photo_credit: Jon
    guide: /hardware/helpers/psu-pigtail/
