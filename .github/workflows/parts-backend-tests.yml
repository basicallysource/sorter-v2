name: Parts backend checks
on:
  pull_request:
    paths: ['parts-calculator/**', '.github/workflows/parts-backend-*.yml']
  push:
    branches: ['**']
    paths: ['parts-calculator/**', '.github/workflows/parts-backend-*.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache-dependency-path: parts-calculator/backend/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: parts-calculator/package-lock.json
      - run: go test -race ./... && go vet ./...
        working-directory: parts-calculator/backend
      - run: npm ci --no-audit --no-fund && npm run check && npm run build
        working-directory: parts-calculator
