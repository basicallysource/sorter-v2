{%- comment -%}
The inner-two-wire swap: StepperOnline's shipped order vs basically board v1.3.
Used on both the wire harness page and the stepper connectors page, which is
why it is an include rather than inline SVG.
{%- endcomment -%}
<figure class="diagram diagram-inline">
  <svg viewBox="0 0 320 130" width="300" height="122" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: pins 1 and 4 pass straight through, pins 2 and 3 cross over between the StepperOnline lead and basically board v1.3">
    <text x="10" y="16" font-size="11" fill="var(--muted)">StepperOnline (as shipped)</text>
    <g stroke="var(--ink)" stroke-width="1.5">
      <line x1="70" y1="51" x2="70" y2="84" />
      <line x1="120" y1="51" x2="170" y2="84" />
      <line x1="170" y1="51" x2="120" y2="84" />
      <line x1="220" y1="51" x2="220" y2="84" />
    </g>
    <g fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4">
      <circle cx="70" cy="40" r="11" /><circle cx="120" cy="40" r="11" />
      <circle cx="170" cy="40" r="11" /><circle cx="220" cy="40" r="11" />
      <circle cx="70" cy="95" r="11" /><circle cx="120" cy="95" r="11" />
      <circle cx="170" cy="95" r="11" /><circle cx="220" cy="95" r="11" />
    </g>
    <g font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="700">
      <text x="70" y="44">1</text><text x="120" y="44">2</text><text x="170" y="44">3</text><text x="220" y="44">4</text>
      <text x="70" y="99">1</text><text x="120" y="99">2</text><text x="170" y="99">3</text><text x="220" y="99">4</text>
    </g>
    <text x="10" y="124" font-size="11" fill="var(--muted)">basically board v1.3 - inner two swapped</text>
  </svg>
</figure>
