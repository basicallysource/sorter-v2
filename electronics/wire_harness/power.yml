metadata:
  title: 24V power distribution
  description: "PSU box pigtails PSU1-PSU3 and load cables PWR1-PWR3. The PSU end\nand the board end follow the DC_PSU_Harness and\ncontroller-board reference drawings (2026-08-08),\nwhich are the source of truth for those."

connectors:
  PSU:
    type: LRS-350-24 terminal block
    pincount: 9
    pinlabels: [AC/L, AC/N, FG, -V, -V, -V, +V, +V, +V]
    notes: "Screw numbers are MeanWell's (LRS-350-SPEC)\nOne pigtail per pair: 7+4, 8+5, 9+6\nScrews 1-3 are mains, on the IEC inlet's own leads\nTerminal spec: see the PSU output pigtail drawing"
  J1: &jack
    type: DC jack 5.5x2.1 female, panel-mount
    pinlabels: [+24V (tip), GND (sleeve)]
  J2: *jack
  J3: *jack
  P1: &plug
    type: DC plug 5.5x2.1 male
    pinlabels: [+24V (tip), GND (sleeve)]
  P2: *plug
  P3: *plug
  BOARD_PWR:
    type: JST VH 2-pin (VHR-2)
    subtype: female
    pinlabels: [+24V, GND]
    notes: "controller board v1.3 24V input\nPin 1 = +24V, pin 2 = GND"
    additional_components:
      - type: Terminal - SVH-21T-P1.1
        qty: 1
        qty_multiplier: populated
        manufacturer: JST
        mpn: SVH-21T-P1.1
  HUB:
    type: Bare tinned leads
    pinlabels: [+24V, GND]
    notes: "into the hub's 2-pin 24V terminal\n(+ and - are printed on the hub board)"
  BUCK:
    type: Bare tinned leads
    pinlabels: [+24V, GND]
    notes: "splice to the 24V-5V USB-C\nbuck input leads"

cables:
  PSU1: &pigtail
    gauge: 18 AWG
    length: 4 in
    colors: [RD, BK]
    notes: "PSU-J pigtail, inside the PSU box\nComes attached to the jack already, so buy\nthe jacks with leads rather than have these made"
  PSU2: *pigtail
  PSU3: *pigtail
  PWR1:
    gauge: 18 AWG
    length: 36 in
    colors: [RD, BK]
    notes: "board 24V in\nLength deliberately long"
  PWR2:
    gauge: 22 AWG
    length: 12 in
    colors: [RD, BK]
    notes: "USB hub. Plug at one end, bare tinned end\ninto the hub's 24V terminal."
  PWR3:
    gauge: 22 AWG
    length: 6 in
    colors: [RD, BK]
    notes: "Orange Pi buck. Plug at one end, bare tinned\nend spliced to the buck input leads."

connections:
  -
    - PSU: [7, 4]
    - PSU1: [1-2]
    - J1: [1-2]
  -
    - PSU: [8, 5]
    - PSU2: [1-2]
    - J2: [1-2]
  -
    - PSU: [9, 6]
    - PSU3: [1-2]
    - J3: [1-2]
  -
    - P1: [1-2]
    - PWR1: [1-2]
    - BOARD_PWR: [1-2]
  -
    - P2: [1-2]
    - PWR2: [1-2]
    - HUB: [1-2]
  -
    - P3: [1-2]
    - PWR3: [1-2]
    - BUCK: [1-2]
  -
    - J1
    - <==>
    - P1
  -
    - J2
    - <==>
    - P2
  -
    - J3
    - <==>
    - P3
