  - name: channel-stepper
    title: Channel stepper lead (STP1 to STP4)
    of: steppers
    guide: /hardware/helpers/channel-stepper-lead/
    caption: >-
      One of the four c-channel motor leads (STP1 to STP4). Board PHR-4 to the motor's own
      PHR-6, and not straight through: two conductors change places, which is
      the crossing pair in the middle of the drawing.
    png: https://assets.basically.website/sorter-harness/channel-stepper-full-ea9de691cb30.png
    svg: https://assets.basically.website/sorter-harness/channel-stepper-e293225307ca.svg
