[project]
name = "client"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# Pinned to 3.12 because `rknn-toolkit-lite2` (RK3588 NPU inference, used on
# the Orange Pi) only ships prebuilt wheels for cp37-cp312. No cp313 wheel
# exists upstream and the package wraps a closed-source binary, so we can't
# rebuild it ourselves. Bump only when rknn-toolkit-lite2 publishes a
# matching cp313+ wheel.
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=42",
    "cv2-enumerate-cameras>=1.3.3",
    "fastapi>=0.128.3",
    "flask>=3.1.3",
    "ncnn>=1.0.20260114",
    "numpy>=2.4.2",
    "onnxruntime>=1.23.2",
    "openai>=2.30.0",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.0",
    "pyserial>=3.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "rknn-toolkit-lite2>=2.3.2; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "supervision>=0.27.0.post2",
    "tomli-w>=1.2.0",
    "uvicorn[standard]>=0.40.0",
    "websockets>=16.0",
    "wsproto>=1.3.2",
]

[tool.pyright]
reportMissingImports = "none"
reportMissingModuleSource = "none"

[dependency-groups]
dev = [
    "pydantic-to-typescript==2.0.0",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
]
