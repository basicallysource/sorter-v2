  - name: leds
    title: LED drops and limit switch (LED1a to LED3a, LED1 to LED3, LIM1)
    caption: >-
      LED feeds LED1a to LED3a to their unplug-point jacks, pigtails LED1 to LED3 to the LED
      strips, and the limit switch cable (LIM1, 1x3 dupont at the
      board, push-on blade terminals at the switch).
    png: https://assets.basically.website/sorter-harness/leds-full-4aa4bb0d5733.png
