# The drawings on the WireViz page, in display order.
#
# The URLs below are literal on purpose. Every harness artifact is published
# under a name containing a hash of its own bytes, nothing in the asset
# service is ever overwritten, and nothing here is derived at build time -- so a drawing's
# URL changes in the same commit that changes the drawing, and the docs can
# never name bytes that have not been uploaded yet. Do not replace these with
# anything computed; see electronics/wire_harness/AGENTS.md for the outage that
# rule comes from.
#
# `name` is the basename of the drawing's source, electronics/wire_harness/<name>.yml.
# It is also the heading's anchor on the page, so /hardware/parts/harness-order/#<name>
# links straight to one drawing. `guide:` is the helper page for building the
# cable; the page renders the same "How to make your own" label for every one,
# so do not add a per-drawing label back.
#
# Changing a drawing: edit the source, push, and CI fails with the exact block
# of URLs to paste back in here. Adding one: a new YAML source, an entry here,
# an entry in the `drawings` list in electronics/wire_harness/build-harness.sh
# (the supplier zip's member list), then the same paste.

zip: https://assets.basically.website/sorter-harness/sorter-v2-harness-rfq-b96327a1af7d.zip

drawings:
  - name: power
    title: 24V power distribution (PSU1 to PSU3, PWR1 to PWR3)
    caption: >-
      PSU box pigtails PSU1 to PSU3 and load cables PWR1 to PWR3, one per 24V load: the
      board, the USB hub and the Orange Pi buck. Dashed arrows are barrel
      jack/plug mates. This is the overview; the two buildable sub-harnesses
      it is made of are below it.
    png: https://assets.basically.website/sorter-harness/power-full-c713457c3ca6.png
    svg: https://assets.basically.website/sorter-harness/power-1679462e0ae5.svg
    pdf: https://assets.basically.website/sorter-harness/power-b9f251658c2c.pdf
