name: Regenerate part data

# Lives in parts-calculator/ since the 2026-08 repo merge; only its paths
# trigger this.
#
# Runs the slicer pipeline (OrcaSlicer CLI, headless) whenever its inputs
# change on a PR branch or main, and commits the regenerated JSON, renders,
# and serving copies back to the branch. This makes CI the canonical slicer
# environment: any agent (or human) can edit slicer/parts.json or drop in an
# STL, push, and the Vercel preview picks up correct measured grams and fresh
# thumbnails without a local OrcaSlicer install.
#
# Speed model:
#  - Only slicer-input paths trigger this at all; most PRs run nothing.
#  - Slice results are memoized per (STL bytes + settings) in tiny info.json
#    files, cached across runs. A warm run re-slices only what a PR changed.
#  - A settings change (slicer/filament.py) invalidates every part and
#    re-slices the whole catalog once. That run is slow by nature; it blocks
#    nothing -- the regen commit lands on the branch when it finishes.
#
# The pinned OrcaSlicer version below is part of the data: grams are the
# slicer's own numbers, so bumping the version is a data change -- expect a
# catalog-wide rebaseline commit when you do it deliberately.

on:
  pull_request:
    paths:
      - 'parts-calculator/slicer/parts.json'
      - 'parts-calculator/slicer/parts/**'
      - 'parts-calculator/slicer/plates/**'
      - 'parts-calculator/slicer/filament.py'
      - 'parts-calculator/slicer/requirements.txt'
      - 'parts-calculator/src/lib/bambu-colors.ts'
      - 'parts-calculator/scripts/sync_bucket.py'
      - '.github/workflows/regen-parts.yml'
  push:
    branches: [main]
    paths:
      - 'parts-calculator/slicer/parts.json'
      - 'parts-calculator/slicer/parts/**'
      - 'parts-calculator/slicer/plates/**'
      - 'parts-calculator/slicer/filament.py'
      - 'parts-calculator/slicer/requirements.txt'
      - 'parts-calculator/src/lib/bambu-colors.ts'
      - 'parts-calculator/scripts/sync_bucket.py'
      - '.github/workflows/regen-parts.yml'
  schedule:
    # Twice-weekly no-op run: keeps the slice-memo cache from being evicted
    # (7-day LRU -- weekly would race the expiry) and fails loudly if the
    # pipeline has drifted (a clean tree should regenerate byte-identically).
    # Known benign wobble if the cache IS ever cold: Orca's auto-support is
    # slightly nondeterministic, so support-enabled parts can move ~0.2 g
    # between cold slices. The memo cache pins values; a drift failure here
    # most likely means the cache was evicted, not that data is wrong.
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

concurrency:
  group: regen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORCA_VERSION: '2.4.0'
  ORCA_APPIMAGE_URL: 'https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.4.0/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.4.0.AppImage'
  ORCA_APPIMAGE_SHA256: '46556197dcc2fb55140e0b1e70c28b4c4da3208f12a4a2522012837c9d77ee10'

jobs:
  regen:
    runs-on: ubuntu-latest
    # Fork PRs can't receive push-backs or secrets; the bot pushes in-repo
    # branches, so this only excludes drive-by forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          # Shallow is fine: old part geometry comes from the bucket via the
          # stl_hash pins in parts.json, never from git history.
          fetch-depth: 1

      - name: Cache OrcaSlicer ${{ env.ORCA_VERSION }}
        id: orca-cache
        uses: actions/cache@v4
        with:
          path: ~/orca
          key: orca-${{ env.ORCA_VERSION }}-ubuntu2404-extracted

      - name: Install OrcaSlicer
        if: steps.orca-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/orca.AppImage "$ORCA_APPIMAGE_URL"
          echo "$ORCA_APPIMAGE_SHA256  /tmp/orca.AppImage" | sha256sum -c
          chmod +x /tmp/orca.AppImage
          # Extract instead of mounting: GitHub runners have no FUSE.
          cd /tmp && ./orca.AppImage --appimage-extract >/dev/null
          mv /tmp/squashfs-root ~/orca

      - name: Resolve OrcaSlicer paths
        run: |
          set -x
          ORCA_BIN="$HOME/orca/AppRun"
          ORCA_PROFILES=$(find ~/orca -type d -path '*profiles/BBL' | head -1)
          test -x "$ORCA_BIN"
          test -d "$ORCA_PROFILES"
          echo "ORCA_BIN=$ORCA_BIN" >> "$GITHUB_ENV"
          echo "ORCA_PROFILES=$ORCA_PROFILES" >> "$GITHUB_ENV"

      - name: Smoke-test OrcaSlicer
        # The AppImage links GUI libraries the runner image may not ship.
        # Diagnose with ldd, install the known-needed set, and refuse to
        # continue unless the binary actually starts.
        run: |
          real_bin=$(find ~/orca -type f -name orca-slicer | head -1)
          if ldd "$real_bin" | grep "not found"; then
            sudo apt-get update -q
            sudo apt-get install -y -q libwebkit2gtk-4.1-0 libgstreamer1.0-0 \
              libgstreamer-plugins-base1.0-0 libegl1 libopengl0 libglu1-mesa \
              libsoup-3.0-0 libsecret-1-0 libfuse2
            ldd "$real_bin" | grep "not found" && exit 1 || true
          fi
          xvfb-run -a "$ORCA_BIN" --help > /tmp/orca-smoke.log 2>&1 \
            || { echo "orca failed to start (rc=$?):"; cat /tmp/orca-smoke.log; exit 1; }
          head -3 /tmp/orca-smoke.log

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: parts-calculator/slicer/requirements.txt

      - run: pip install -r parts-calculator/slicer/requirements.txt

      # Only the slice memos (a few hundred bytes per part), not the 3MFs --
      # the memo alone is what makes a warm run skip re-slicing. Failure
      # markers are deliberately NOT cached: a transient CI failure must not
      # be memoized as "this part can't slice".
      - name: Restore slice memo cache
        uses: actions/cache@v4
        with:
          path: parts-calculator/slicer/build/cache/*/info.json
          key: slice-memos-v1-${{ github.run_id }}
          restore-keys: slice-memos-v1-

      - name: Regenerate
        run: |
          xvfb-run -a python parts-calculator/slicer/filament.py --strict

      - name: Upload artifacts to bucket
        # Content-addressed + head-checked, so uploading from a PR branch is
        # safe and idempotent; it pre-stages exactly the bytes main would
        # upload after merge, making preview download links work immediately.
        env:
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          if [ -z "$DO_SPACES_KEY" ]; then
            echo "no bucket credentials in this context; skipping upload"
            exit 0
          fi
          python parts-calculator/scripts/sync_bucket.py

      - name: Verify every bucket URL actually resolves
        # Runs BEFORE the commit-back so broken asset URLs can never reach
        # main. The bucket is content-addressed, so a wrong URL is a 200
        # serving the wrong bytes, not a 404 -- nothing else we run would
        # notice. With no binary serving copies in the repo, this is also what
        # catches "generated data references bytes nobody uploaded" (e.g. a
        # fork PR, which gets no bucket credentials).
        run: |
          python parts-calculator/scripts/check_bucket_urls.py

      - name: Commit regenerated data
        run: |
          git add parts-calculator/src/lib/data/parts.generated.json \
                  parts-calculator/src/lib/data/plates.generated.json \
                  parts-calculator/static/renders parts-calculator/static/plate-thumbs \
                  parts-calculator/slicer/artifacts.json
          if git diff --cached --quiet; then
            echo "outputs already up to date"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::error::weekly drift check found differences -- pipeline is not deterministic or main has stale outputs"
            git diff --cached --stat
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate part data (CI slicer, Orca $ORCA_VERSION)"
          # Rebase and retry on a rejected push (a human or another job may
          # have landed on the branch mid-run) rather than making the caller
          # re-run the whole job.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt) -- rebasing onto the new head"
            git pull --rebase --autostash
          done
          echo "::error::could not push regenerated data after 3 attempts"
          exit 1
